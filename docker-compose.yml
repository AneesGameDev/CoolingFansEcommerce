version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ohomart_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - ohomart_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ohomart_backend
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Override MONGO_URL so the backend container reaches the mongodb service by name
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - ohomart_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These bake REACT_APP_* into the React bundle at build time.
        # Override from the shell: REACT_APP_BACKEND_URL=https://yourdomain.com docker compose up --build
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://ohomart.online}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-845488070993-ak986ktr940p9nuk2aciqquhidn01mat.apps.googleusercontent.com}
    container_name: ohomart_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ohomart_net

volumes:
  mongo_data:

networks:
  ohomart_net:
    driver: bridge
